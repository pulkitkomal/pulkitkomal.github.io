---
layout: default
---
<article class="note">
  <p class="kicker"><a href="{{ '/' | relative_url }}#notes">← Notes</a></p>
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%b %-d, %Y" }}{% if page.source %} · <a href="{{ page.source }}">source</a>{% endif %}</p>
  <div class="prose">
    {{ content }}
  </div>
</article>
