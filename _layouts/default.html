<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="shell">
      <header class="top">
        <a class="mark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav>
          <a href="{{ '/' | relative_url }}#work">Work</a>
          <a href="{{ '/' | relative_url }}#notes">Notes</a>
          <a class="resume" href="{{ '/assets/Pulkit_Komal_Resume.pdf' | relative_url }}" target="_blank" rel="noopener">Resume</a>
        </nav>
      </header>
      {{ content }}
      <footer class="foot">
        <p>
          <a href="mailto:{{ site.email }}">{{ site.email }}</a>
          <span class="sep">·</span>
          <a href="{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
          <span class="sep">·</span>
          <a href="{{ '/assets/Pulkit_Komal_Resume.pdf' | relative_url }}" target="_blank" rel="noopener">Resume PDF</a>
        </p>
      </footer>
    </div>
  </body>
</html>
